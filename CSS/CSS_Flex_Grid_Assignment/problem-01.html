<!DOCTYPE html>
<html>
  <head>
    <title>GLA</title>
  <style>
    .text{
        font-family: Georgia, 'Times New Roman', Times, serif;
        font-size: 25px;
        display: flex;
        justify-content: center;
        color:  rgb(2, 2, 49);
    }
    #start{
        width:100%;
        height:50px;
        background-color: rgb(2, 2, 49);
        padding: 10px;
        display: flex;
        justify-content: space-between;
    }
    .navs{
        justify-content: space-between;
        margin-right: 20px;
    }
    .gla{
        display: flex;
    }
     .logos{
        color:white;
        margin-left: 10px;
    }
    
    .nav{
        color:white;
        margin-top:0px;
        margin-left: 5px;
    }
    
    .navi{
        color:white;
        margin-top:auto;
    }
  
    #main{
        display:flex;   
        width:100%;
        height:200px;
        justify-content: center;
        margin:20px;
    
    }
    .child {
      width:200px;
      height:200px;
      border: 1px solid black;
      border-radius: 20px ;
      color:white;
      margin:20px;
      gap: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .uni{
        display:block;
    }
    
    #second{
        display:flex;
        width:100%;
        height:200px;
        justify-content: center;
        margin:20px;
    }
    .box {
      width:200px;
      height:200px;
      border: 1px solid black;
      border-radius: 20px ;
      color:white;
      margin:20px;
      gap: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #last{
        display: flex;
        justify-content: center;
        margin: 50px;
    }
    .end{
        color:black;
    }
    .about{
        margin: 10px;
    }
    .home{
        margin: 10px;
    }
    .gallery{
        margin: 10px;
    }
    </style>
  </head>
  <body>
    <div id="start">
        <div class="gla">
            <img src="gla.jpg" alt="Gla logo" class="logos">
            <div class="uni">
            <p class="nav">GLA</p>
            <p class="navi">University</p>
            </div>
        </div>
            <nav class="navs">
            <a href="#home" class="home">Home</a>
            <a href="#gallery" class="gallery">Gallery</a>
            <a href="#about" class="about">About</a>
            </nav>
    </div>
    <h1 class="text">Photo Gallery</h1>
     <center><img src="logo.jpg"></center>
      <div id="main">
        <div class="child">
            <img src="image.jpg">
        </div>
        <div class="child">
            <img src="image.jpg">
        </div>
        <div class="child">
            <img src="image.jpg"></div>
      </div>
      <div id="second">
        <div class="box">
            <img src="image.jpg"></div>
        <div class="box">
            <img src="image.jpg"></div>
        <div class="box">
            <img src="image.jpg"></div>
       </div>
       <div id="last">
            <a class="end" href="#">Image Link - "https://web.whatsapp.com/"</a>
       </div>
  </body>
</html>
